<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Production CSP. script-src is 'self' ONLY — no 'unsafe-inline'/'unsafe-eval'.
      The built renderer has zero inline scripts (its single entry is an external
      same-origin module), so untrusted mod content (README / Nexus / Steam
      descriptions rendered via dangerouslySetInnerHTML) can no longer reach a
      script execution sink even if it slipped past DOMPurify — DOMPurify is now
      backed by the CSP rather than being the sole XSS barrier.
      style-src keeps 'unsafe-inline' (React inline styles, Tailwind, the splash
      <style>). The Vite dev server injects inline HMR/Fast-Refresh scripts and
      uses eval, so electron.vite.config.mjs relaxes this meta to a permissive
      policy while serving (dev only, never in the shipped build).
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; frame-src 'none'" />
    <title>HZMM Manager</title>
    <style>
      /* Splash: liquid brand mark, driven by public/splash.js and App.jsx.
         1. Once the interface underneath has had its first paint (unseen),
            droplets fly in from beyond the window edges and settle into a
            ring that keeps circling, with the HZMM wordmark and a loading
            line below, for as long as the app takes to load.
         2. When the app is ready, a pre-rendered clip (public/
            splash-liquid.webm, scripts/render-splash-liquid.cjs; video plays
            off the main thread) takes the ring over in place, turned to its
            current angle, and swirls it into a wobbling pool that ripples
            and becomes the logo.
         3. A liquid wave opens the backdrop from the logo out past the far
            corner onto the interface, and the logo flies onto the sidebar.
         Everything that moves is a transform, an opacity or the clip; the
         interface's own animations are held while the splash is up, so the
         GPU has nothing else to draw. The clip is drawn in the logo's own
         orange and themed with the logo's hue-rotate; the droplets get the
         same colours pre-computed by the preload. Theme colours, mode and
         status text come from --s-* properties the preload injects from the
         last session; without them it is dark ember, zh-TW. The CSP allows
         no inline script: CSS here, logic in splash.js. */
      #splash-screen {
        --bg: var(--s-bg, #020617);
        --muted: var(--s-muted, #64748b);
        --accent: var(--s-accent, 249, 115, 22);
        --from: var(--s-from, #f97316);
        --to: var(--s-to, #dc2626);
        --hue: var(--s-hue, 0deg);
        position: fixed; inset: 0; z-index: 99999; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        font-family: "Segoe UI", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
        -webkit-app-region: drag;
        transition: opacity 0.5s ease 0.15s;
      }
      /* The interface stays out of the GPU's way while the splash moves.
         Hidden at first; splash.js then has it paint once ("prepaint",
         behind a 99.6%-opaque backdrop), before anything starts moving, as
         that first paint (glass and gradients rasterised on the GPU) stalled
         every animation it overlapped. Once that is on screen ("painted") it
         drops to opacity 0: still rasterised, but no longer composited every
         frame under the splash, its glass filters and all, until the wave
         opens onto it. Its endless loops (ambient light, logo breath, glows,
         spinners) wait for the splash to go; one-shot entrances still play,
         so the content is in place when the wave reveals it. */
      html:has(#splash-screen:not(.prepaint):not(.handoff):not(.exit)) #root { visibility: hidden; }
      html:has(#splash-screen.painted:not(.handoff):not(.exit)) #root { opacity: 0; }
      html:has(#splash-screen) #root :is(.ambient-key, .logo-breath, .ambient-loop, .animate-spin, .animate-pulse) { animation-play-state: paused !important; }
      #splash-bg {
        position: absolute; inset: 0;
        background: var(--bg);
      }
      #splash-screen.prepaint:not(.painted) #splash-bg { opacity: 0.996; }
      /* The wave: --hole is the radius of the opening in the backdrop,
         centred on the logo (--hole-x/-y) and run out to --hole-end (past
         the farthest corner), both measured by App.jsx. */
      @property --hole { syntax: '<length>'; inherits: true; initial-value: -120px; }
      #splash-screen.handoff {
        --hole: var(--hole-end, 150vmax);
        transition: --hole 0.85s cubic-bezier(0.5, 0.05, 0.3, 1);
      }
      /* Glowing wavefront riding the soft edge of the opening. */
      #splash-wave {
        position: absolute; inset: 0;
        background: rgba(var(--accent), 0.32);
        opacity: 0;
        pointer-events: none;
      }
      /* The masks exist only for the exit: a full-window mask is an extra
         GPU pass every frame. */
      #splash-screen.handoff #splash-bg {
        -webkit-mask-image: radial-gradient(circle at var(--hole-x, 50%) var(--hole-y, 50%), transparent var(--hole), #000 calc(var(--hole) + 110px));
        mask-image: radial-gradient(circle at var(--hole-x, 50%) var(--hole-y, 50%), transparent var(--hole), #000 calc(var(--hole) + 110px));
      }
      #splash-screen.handoff #splash-wave {
        -webkit-mask-image: radial-gradient(circle at var(--hole-x, 50%) var(--hole-y, 50%), transparent calc(var(--hole) - 20px), #000 calc(var(--hole) + 34px), transparent calc(var(--hole) + 110px));
        mask-image: radial-gradient(circle at var(--hole-x, 50%) var(--hole-y, 50%), transparent calc(var(--hole) - 20px), #000 calc(var(--hole) + 34px), transparent calc(var(--hole) + 110px));
        animation: sWave 0.85s ease-out forwards;
      }
      #splash-screen.exit, #splash-screen.handoff { pointer-events: none; }
      /* Plain exit (no sidebar target, reduced motion): everything fades. */
      #splash-screen.exit { opacity: 0; }
      #splash-mark {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
        transform: translateY(-3vh);
      }
      #splash-screen.handoff #splash-halo,
      #splash-screen.handoff #splash-name,
      #splash-screen.handoff #splash-sub,
      #splash-screen.handoff #splash-status,
      #splash-screen.exit #splash-status { opacity: 0; transition: opacity 0.25s ease; animation: none; }

      /* Halo centred on the logo: swells in under the ring, then breathes. */
      #splash-halo {
        position: absolute; left: 50%; top: 48px; width: 520px; height: 520px;
        margin: -260px 0 0 -260px;
        background: radial-gradient(closest-side, rgba(var(--accent), 0.16), rgba(var(--accent), 0.06) 45%, transparent);
        opacity: 0; transform: scale(0.6);
        animation: sHalo 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards, sBreath 3.6s ease-in-out 2s infinite alternate;
        pointer-events: none;
      }
      /* Its own layer from the start, so the flight needs no re-layering. */
      #splash-emblem { position: relative; width: 96px; height: 96px; will-change: transform; }
      #splash-screen.fly #splash-emblem {
        transform: translate(var(--fly-x), var(--fly-y)) scale(var(--fly-s));
        transition: transform 0.7s cubic-bezier(0.65, 0, 0.25, 1);
      }
      /* Theme hue shift (as on the sidebar logo) and the lift shadow apply to
         the clip and the logo alike; the squash plays here during the flight. */
      #splash-body {
        position: absolute; inset: 0;
        filter: hue-rotate(var(--hue)) drop-shadow(0 14px 30px rgba(var(--accent), 0.3));
      }
      #splash-screen.fly #splash-body { animation: sSquash 0.7s cubic-bezier(0.65, 0, 0.25, 1); }
      /* 240px stage centred on the 96px emblem, hidden until it takes the
         ring over; splash.js sets --spin-from to the ring's angle and
         --spin-to to the nearest upright turn, so the clip starts where the
         ring is and the logo lands straight. */
      #splash-spin {
        position: absolute; left: -72px; top: -72px; width: 240px; height: 240px;
        visibility: hidden;
        will-change: transform;
      }
      #splash-screen.forming #splash-spin {
        visibility: visible;
        animation: sSpin 1.2s cubic-bezier(0.45, 0, 0.35, 1) forwards;
      }
      #splash-liquid {
        width: 240px; height: 240px;
        /* Tailwind's preflight caps video at max-width 100% (the 96px emblem). */
        max-width: none; max-height: none;
        pointer-events: none;
      }

      #splash-screen.fly #splash-logo { opacity: 1; }
      #splash-screen.fly #splash-spin { visibility: hidden; }
      /* Same gradient wordmark as the sidebar, tracking in below the ring
         (lowered clear of it), then rising to sit under the logo as the
         ring condenses; trailing tracking is balanced by the same left
         padding. */
      #splash-name, #splash-sub {
        translate: 0 52px;
        transition: translate 0.9s cubic-bezier(0.3, 0, 0.2, 1) 0.55s;
      }
      #splash-screen.forming #splash-name, #splash-screen.forming #splash-sub { translate: 0 0; }
      #splash-name {
        margin-top: 26px;
        padding-left: 0.28em;
        font: 900 34px/1 "Segoe UI", system-ui, -apple-system, sans-serif;
        letter-spacing: 0.28em;
        background: linear-gradient(to right, var(--from), var(--to));
        -webkit-background-clip: text; background-clip: text; color: transparent;
        opacity: 0;
        animation: sTrack 0.9s cubic-bezier(0.16, 1, 0.3, 1) 1.1s forwards;
      }
      #splash-sub {
        margin-top: 12px;
        padding-left: 0.34em;
        font: 600 11px/1 "Segoe UI", system-ui, -apple-system, sans-serif;
        letter-spacing: 0.34em;
        color: var(--muted);
        opacity: 0;
        animation: sFade 0.7s ease 1.4s forwards;
      }
      #splash-status {
        position: absolute; left: 0; right: 0; bottom: 13vh;
        display: flex; align-items: center; justify-content: center; gap: 10px;
        font-size: 12px; color: var(--muted);
        opacity: 0;
        animation: sFade 0.5s ease 1.7s forwards;
      }
      #splash-status::after { content: var(--s-status, "正在載入模組…"); }
      #splash-dots { display: flex; gap: 5px; }
      #splash-dots i {
        width: 5px; height: 5px; border-radius: 50%;
        background: rgba(var(--accent), 0.9);
        animation: sDot 1.2s ease-in-out infinite;
      }
      #splash-dots i:nth-child(2) { animation-delay: 0.15s; }
      #splash-dots i:nth-child(3) { animation-delay: 0.3s; }

      /* Droplets: a vortex seen from above. They pour in from beyond the
         window edges along spirals, turning faster the closer they get
         (angular speed grows as the radius shrinks; the keyframes below are
         sampled from that motion by scripts/splash-vortex-keyframes.cjs,
         each drop stretched along its heading),
         and settle onto the clip's start ring (angle --a, radius --r, size
         --s: keep in step with scripts/render-splash-liquid.cjs). The ring
         then keeps circling at 180 deg/s, the clip's opening spin, each drop
         bobbing gently, until the clip takes over and winds them in faster
         still. Each main drop has a smaller satellite on a wider spiral that
         melts into it on arrival. Colours come pre-hue-rotated from the
         preload (--drip-*): a filter here would be a window-sized offscreen
         pass every frame. Every drop is its own layer. */
      #splash-drips {
        position: absolute; left: 50%; top: 48px; width: 0; height: 0;
        will-change: transform;
        animation: sLoop 2s linear 1.7s infinite;
        pointer-events: none;
      }
      #splash-screen.forming #splash-drips { visibility: hidden; animation-play-state: paused; }
      .drip {
        position: absolute; left: 0; top: 0;
        will-change: transform, opacity;
        opacity: 0;
        animation: sVortex calc(1.7s - var(--d)) linear var(--d) both;
      }
      .drip.sat { animation: sVortexSat calc(1.7s - var(--d)) linear var(--d) both, sFadeOut 0.12s linear 1.75s forwards; }
      .drip i {
        position: absolute;
        width: calc(var(--s) * 2); height: calc(var(--s) * 2);
        margin: calc(var(--s) * -1) 0 0 calc(var(--s) * -1);
        border-radius: 50%;
        will-change: transform;
        background: radial-gradient(circle at 40% 34%, var(--drip-1, #ffd6b0) 0 6%, var(--drip-2, #f7772a) 32%, var(--drip-3, #e3452a) 78%, var(--drip-4, #c92a20));
        box-shadow: inset -2px -3px 5px var(--drip-5, rgba(120, 20, 10, 0.35));
        animation: sBob var(--bob, 1.4s) ease-in-out 1.7s infinite alternate;
      }
      @keyframes sVortex {
        0% { transform: rotate(calc(var(--a) - 217.0deg)) translateX(calc(var(--r) * 9.000)) rotate(100.9deg) scale(2.200, 0.674); opacity: 0.00; }
        4.17% { transform: rotate(calc(var(--a) - 209.3deg)) translateX(calc(var(--r) * 8.537)) rotate(111.7deg) scale(2.200, 0.674); opacity: 0.42; }
        8.33% { transform: rotate(calc(var(--a) - 201.5deg)) translateX(calc(var(--r) * 8.082)) rotate(112.3deg) scale(2.200, 0.674); opacity: 0.83; }
        12.5% { transform: rotate(calc(var(--a) - 193.7deg)) translateX(calc(var(--r) * 7.636)) rotate(113.0deg) scale(2.200, 0.674); opacity: 1; }
        16.67% { transform: rotate(calc(var(--a) - 185.8deg)) translateX(calc(var(--r) * 7.198)) rotate(113.7deg) scale(2.200, 0.674); opacity: 1; }
        20.83% { transform: rotate(calc(var(--a) - 178.0deg)) translateX(calc(var(--r) * 6.768)) rotate(114.4deg) scale(2.200, 0.674); opacity: 1; }
        25% { transform: rotate(calc(var(--a) - 170.0deg)) translateX(calc(var(--r) * 6.348)) rotate(115.2deg) scale(2.200, 0.674); opacity: 1; }
